name: Test wheel and publish container

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            constraints-cuda128.txt
            pyproject.toml
      - name: Install CPU dependencies and build wheel
        run: |
          python -m pip install setuptools==79.0.1 wheel==0.46.3 pytest==9.0.2
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints-cuda128.txt -r requirements-runtime.txt
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip install --no-deps dist/*.whl
      - name: Test installed wheel outside checkout
        run: |
          cd "$(mktemp -d)"
          python -I -m deepstarnoodles_inference smoke --device cpu
          python -I -m pytest -q "$GITHUB_WORKSPACE/tests"

  container:
    needs: wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/weertman/deepstarnoodles-inference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free ephemeral runner disk for the CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/weertman/deepstarnoodles-inference
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/weertman/deepstarnoodles-inference
            org.opencontainers.image.title=DeepStarNoodles inference
      - name: Build CUDA runtime and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true,timeout=5m
          provenance: mode=max
          sbom: true
      - name: Record immutable image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf 'Image: `ghcr.io/weertman/deepstarnoodles-inference@%s`\n\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Source commit: `%s`\n\nTags:\n```\n%s\n```\n' "$GITHUB_SHA" "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
